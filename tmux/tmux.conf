# Prefix: C-a instead of the default C-b -- screen-style, closer to the
# muscle memory most Linux users already have. C-a a sends a literal C-a
# through to the shell/readline (start-of-line) since the prefix eats it
# otherwise.
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind a send-prefix

set -g mouse on
set -g history-limit 50000
set -g escape-time 10          # low, so nvim's <Esc> doesn't feel laggy
set -g focus-events on
set -g renumber-windows on
set -g base-index 1            # windows/panes start at 1, matching the keyboard row
setw -g pane-base-index 1
set -g status-position bottom
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB,*256col*:RGB"

# reload config without restarting the server
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux config reloaded"

# --- splits / panes -----------------------------------------------------
# vim-mnemonic splits, opening in the current pane's cwd
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# pane resize, repeatable while holding prefix
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- copy mode: vi keys, macOS clipboard ---------------------------------
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel

# --- theme: matches the moonfly-neutrals + Catppuccin-Macchiato-accents
# hybrid already used in alacritty/ghostty (see ../ghostty/config) --------
set -g status-style "bg=#080808,fg=#949494"
set -g status-left-length 32
set -g status-left "#[fg=#080808,bg=#a6da95,bold] #S #[fg=#a6da95,bg=#080808]"
set -g status-right-length 60
set -g status-right "#[fg=#8bd5ca,bg=#080808]#[fg=#080808,bg=#8bd5ca] %H:%M #[fg=#8aadf4,bg=#080808]#[fg=#080808,bg=#8aadf4,bold] #h "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=#080808,bg=#8aadf4,bold] #I:#W #[fg=#8aadf4,bg=#080808]"
set -g pane-active-border-style "fg=#8aadf4"
set -g pane-border-style "fg=#323437"
set -g message-style "bg=#8aadf4,fg=#080808,bold"

# --- plugins (TPM: prefix + I to install, prefix + U to update) ---------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'          # system-clipboard integration beyond the copy-mode bind above
set -g @plugin 'christoomey/vim-tmux-navigator'  # C-h/j/k/l moves between tmux panes AND nvim splits seamlessly
set -g @plugin 'tmux-plugins/tmux-resurrect'     # prefix + C-s save, prefix + C-r restore
set -g @plugin 'tmux-plugins/tmux-continuum'     # auto-save every 15 min + auto-restore on tmux start

set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

run '~/.config/tmux/plugins/tpm/tpm'
