# Place a copy of this config to ~/.aerospace.toml
# After that, you can edit ~/.aerospace.toml to your liking

# You can use it to add commands that run after login to macOS user session.
# 'start-at-login' needs to be 'true' for 'after-login-command' to work
# Available commands: https://nikitabobko.github.io/AeroSpace/commands
after-login-command = []

# You can use it to add commands that run after AeroSpace startup.
# 'after-startup-command' is run after 'after-login-command'
# Available commands : https://nikitabobko.github.io/AeroSpace/commands
after-startup-command = ['exec-and-forget sketchybar',

                        # Loads ~/.config/borders/bordersrc (style/width/
                        # inactive_color/initial active_color -- see that
                        # file). There used to be a second `borders
                        # active_color=... width=...` call right after this
                        # one that silently overrode bordersrc's values with
                        # a different (and also malformed -- missing the
                        # alpha byte) color and width on every startup; the
                        # active_color it set is now owned by
                        # border-color-follow-focus.sh below instead, so
                        # that duplicate call was just removed rather than
                        # fixed in place.
                        'exec-and-forget borders',

                        # Gives the just-focused window a fresh random color
                        # from the Catppuccin Macchiato accents (same set
                        # sketchybar/icons already use) every time focus
                        # moves to a different window -- borders itself has
                        # no per-window/random color feature (man borders),
                        # just one global active_color, so this polls for
                        # focus changes and live-updates it.
                        'exec-and-forget $HOME/.config/aerospace/scripts/border-color-follow-focus.sh',

                        # Re-apply the last saved window->workspace layout.
                        # Runs on every AeroSpace startup (login, manual
                        # restart, crash recovery -- after-startup-command
                        # fires regardless of why AeroSpace just started).
                        # Retries for a couple minutes since macOS relaunches
                        # login-item apps gradually, not all at once.
                        'exec-and-forget $HOME/.config/aerospace/scripts/restore-layout-loop.sh'
]
# Notify Sketchybar about workspace change, and snapshot the layout so a
# crash/restart right after switching doesn't lose it (the layout-saver
# LaunchAgent also does this every 10s independently of AeroSpace).
exec-on-workspace-change = ['/bin/bash', '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE; $HOME/.config/aerospace/scripts/save-layout.sh; $HOME/.config/aerospace/scripts/pip-follow.sh "$AEROSPACE_FOCUSED_WORKSPACE"'
]


# Start AeroSpace at login
start-at-login = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
# Was 'false': a container that drops back to one child (e.g. a floating
# popup like Raycast closing) kept its old split ratio instead of the
# remaining window expanding to fill the space -> windows stuck at ~50% width.
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 30

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# Fallback value (if you omit the key): on-focused-monitor-changed = []
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# You can effectively turn off macOS "Hide application" (cmd-h) feature by toggling this flag
# Useful if you don't use this macOS feature, but accidentally hit cmd-h or cmd-alt-h key
# Also see: https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
automatically-unhide-macos-hidden-apps = false

# Workspaces 1-6 live on the main/ultrawide display, the rest live on the
# built-in MacBook display. 'main' = whatever macOS Displays settings marks
# as the main display (confirmed that's the ultrawide here); 'secondary' =
# the other monitor when exactly two are connected. When only one monitor
# is plugged in (e.g. the ultrawide gets disconnected), there's nowhere else
# for a workspace to go, so every workspace just shows on that one screen.
# See https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[workspace-to-monitor-force-assignment]
    1 = 'main'
    2 = 'main'
    3 = 'main'
    4 = 'main'
    5 = 'main'
    6 = 'main'
    7 = 'secondary'
    8 = 'secondary'
    9 = 'secondary'
    10 = 'secondary'
    11 = 'secondary'
    S = 'secondary'

# Float utility/popup windows instead of letting them grab a tiling slot.
# Hyprland-equivalent: windowrulev2 = float, class:^(rofi|pavucontrol)$
# Raycast's palette briefly entering the tree is what split Chrome to 50%.
[[on-window-detected]]
if.app-id = 'com.raycast.macos'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

# Chrome's Picture-in-Picture window: keep it out of tiling so it stays a
# small floater. pip-follow.sh (hooked into exec-on-workspace-change below)
# relocates it to whichever workspace is focused, since AeroSpace has no
# "present on all workspaces" concept (nikitabobko/AeroSpace#2).
[[on-window-detected]]
if.app-id = 'com.google.Chrome'
if.window-title-regex-substring = 'Picture.in.Picture'
run = 'layout floating'

# Ghostty's native macOS tabs (cmd+t) each register as their own window with
# the Accessibility API -- the same API AeroSpace uses to detect windows --
# so a new tab is indistinguishable from a genuinely new Ghostty window and
# gets tiled instead of merging into the existing window's tab bar. This is
# a macOS API limitation, not something Ghostty or AeroSpace can fix outright
# (nikitabobko/AeroSpace#887, closed not-planned; ghostty.org/docs/help/
# macos-tiling-wms has this exact snippet). `layout tiling` here is a no-op
# for normal new windows (opened via alt-q/alt-enter, which should still
# tile like any other app) but is what Ghostty's own docs recommend trying
# first for the tab case. If tabs still show up as separate tiled windows
# instead of merging, switch `run` to 'layout floating' instead -- the
# tradeoff there is every new Ghostty window starts floating and needs
# manually un-floating (alt-shift-; then f).
[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = 'layout tiling'



# Possible values: (qwerty|dvorak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
[key-mapping]
    preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See:
#                 https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[gaps]
    inner.horizontal = 10
    inner.vertical =   10
    outer.left =       10
    outer.bottom =     5
    # Flat 15 was fine on the built-in display (macOS reserves 32pt there for
    # its menu bar, on top of this gap) but on the ultrawide macOS reserves 0pt
    # for a menu bar, so 15 wasn't enough to clear sketchybar's 30px-tall bar
    # -- windows overlapped it. 'main' (the ultrawide) gets a bigger gap to
    # actually clear the bar; other monitors keep the working value of 15.
    outer.top =        [{ monitor.main = 32 }, 15]
    outer.right =      10

# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' binding mode must be always presented
# Fallback value (if you omit the key): mode.main.binding = {}
#
# ---------------------------------------------------------------------------
# Hyprland-parity keymap. $mainMod = alt (Cmd is left alone so native macOS
# app shortcuts like Cmd-C / Cmd-Tab keep working). Every binding below is
# commented with the literal Hyprland default it mirrors.
#
# Two bits of Hyprland this can't reproduce:
#   - mainMod+drag to move/resize floating windows: AeroSpace has no
#     mouse-button bindings. Closest substitute is macOS's own
#     System Settings > Accessibility > Pointer Control >
#     "Drag windows using modifier key".
#   - `pseudo` (dwindle pseudotiling): no equivalent in AeroSpace's
#     tree-based tiling model, so mainMod+P is intentionally unbound.
# ---------------------------------------------------------------------------
[mode.main.binding]

    # All possible keys:
    # - Letters.        a, b, c, ..., z
    # - Numbers.        0, 1, 2, ..., 9
    # - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
    # - F-keys.         f1, f2, ..., f20
    # - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon,
    #                   backtick, leftSquareBracket, rightSquareBracket, space, enter, esc,
    #                   backspace, tab
    # - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
    #                   keypadMinus, keypadMultiply, keypadPlus
    # - Arrows.         left, down, up, right

    # All possible modifiers: cmd, alt, ctrl, shift

    # All possible commands: https://nikitabobko.github.io/AeroSpace/commands

    # --- apps ------------------------------------------------------------
    # Hyprland: bind = $mainMod, Q, exec, $terminal
    # `open -a` on the raw CLI binary just refocused the one running instance
    # instead of spawning a window; `-na` on the .app bundle forces a new
    # Ghostty process (and a new window) every time, and lets AeroSpace
    # detect/tile it like any normal app window.
    alt-q     = 'exec-and-forget open -na /Applications/Ghostty.app'
    alt-enter = 'exec-and-forget open -na /Applications/Ghostty.app' # kept for muscle memory
    # Hyprland: bind = $mainMod, E, exec, $fileManager
    alt-e = 'exec-and-forget open -a Finder'
    # Hyprland: bind = $mainMod, R, exec, $menu  ($menu = Raycast here)
    alt-r = 'exec-and-forget open -a Raycast'

    # --- window management ------------------------------------------------
    # Hyprland: bind = $mainMod, C, killactive
    alt-c = 'close'
    # Hyprland: bind = $mainMod, M, exit (shifted here so it can't be hit by accident)
    alt-shift-m = 'exec-and-forget killall AeroSpace'
    # Hyprland: bind = $mainMod, V, togglefloating
    alt-v = 'layout floating tiling'
    alt-shift-space = 'layout floating tiling' # alias, kept from the old i3-style config
    # Hyprland: bind = $mainMod, F, fullscreen, 0 / bind = $mainMod SHIFT, F, fullscreen, 1
    alt-f       = 'fullscreen' # in-tiling fullscreen (takes over the workspace)
    # macos-native-fullscreen moves the window to its own macOS Space, which
    # desyncs it from AeroSpace's tiling tree -- known upstream bug where the
    # window (esp. if floating) gets stuck and won't tile again afterwards
    # (https://github.com/nikitabobko/AeroSpace/issues/878). Kept off alt-shift-f
    # since that's a one-modifier fat-finger away from alt-f/alt-v.
    alt-shift-u = 'macos-native-fullscreen' # true macOS fullscreen (closest to fullscreen mode 1)
    # Hyprland: bind = $mainMod, J, togglesplit (dwindle split-orientation toggle)
    alt-j     = 'layout tiles horizontal vertical'
    alt-slash = 'layout tiles horizontal vertical'     # alias, kept from the old config
    alt-comma = 'layout accordion horizontal vertical' # extra: i3-style stacking toggle, not in Hyprland

    # See: https://nikitabobko.github.io/AeroSpace/commands#focus
    # Hyprland: bind = $mainMod, <arrow>, movefocus, l|r|u|d
    # --boundaries all-monitors-outer-frame treats every monitor as one
    # continuous frame, so hitting the edge of the current monitor's
    # workspace crosses to the bordering window on the adjacent monitor
    # instead of wrapping back around the same screen. Falls back to
    # wrapping across all monitors once there's nowhere further to go.
    alt-left  = 'focus --boundaries all-monitors-outer-frame --boundaries-action wrap-around-all-monitors left'
    alt-down  = 'focus --boundaries all-monitors-outer-frame --boundaries-action wrap-around-all-monitors down'
    alt-up    = 'focus --boundaries all-monitors-outer-frame --boundaries-action wrap-around-all-monitors up'
    alt-right = 'focus --boundaries all-monitors-outer-frame --boundaries-action wrap-around-all-monitors right'

    # See: https://nikitabobko.github.io/AeroSpace/commands#move
    # Hyprland: bind = $mainMod SHIFT, <arrow>, movewindow, l|r|u|d
    alt-shift-left  = 'move left'
    alt-shift-down  = 'move down'
    alt-shift-up    = 'move up'
    alt-shift-right = 'move right'

    # Resize. Hyprland does this via mainMod+drag; AeroSpace has no mouse
    # bindings, so these are the keyboard stand-in.
    # See: https://nikitabobko.github.io/AeroSpace/commands#resize
    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    # See: https://nikitabobko.github.io/AeroSpace/commands#workspace
    # Hyprland: bind = $mainMod, [1-0], workspace, N
    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-6 = 'workspace 6'
    alt-7 = 'workspace 7'
    alt-8 = 'workspace 8'
    alt-9 = 'workspace 9'
    alt-0 = 'workspace 10'
    # See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
    # Hyprland: bind = $mainMod SHIFT, [1-0], movetoworkspace, N
    # --focus-follows-window: moving a window to workspace N also switches
    # focus to N (Hyprland's movetoworkspace already does this; AeroSpace
    # doesn't by default). Not applied to the alt-shift-s scratchpad move
    # further down -- that one's the opposite intent, tuck a window away
    # *without* leaving your current workspace.
    alt-shift-1 = 'move-node-to-workspace 1 --focus-follows-window'
    alt-shift-2 = 'move-node-to-workspace 2 --focus-follows-window'
    alt-shift-3 = 'move-node-to-workspace 3 --focus-follows-window'
    alt-shift-4 = 'move-node-to-workspace 4 --focus-follows-window'
    alt-shift-5 = 'move-node-to-workspace 5 --focus-follows-window'
    alt-shift-6 = 'move-node-to-workspace 6 --focus-follows-window'
    alt-shift-7 = 'move-node-to-workspace 7 --focus-follows-window'
    alt-shift-8 = 'move-node-to-workspace 8 --focus-follows-window'
    alt-shift-9 = 'move-node-to-workspace 9 --focus-follows-window'
    alt-shift-0 = 'move-node-to-workspace 10 --focus-follows-window'

    # Hyprland: bind = $mainMod, mouse_down/mouse_up, workspace, e+1/e-1
    # (no mouse-scroll bindings in AeroSpace, so brackets stand in for scroll-to-cycle)
    alt-leftSquareBracket  = 'workspace --wrap-around prev'
    alt-rightSquareBracket = 'workspace --wrap-around next'

    # Hyprland: bind = $mainMod, S, togglespecialworkspace, magic
    #           bind = $mainMod SHIFT, S, movetoworkspacesilent, special:magic
    # AeroSpace has no true scratchpad/special-workspace, so this emulates it
    # with a dedicated "S" workspace that --auto-back-and-forth toggles into/out of.
    alt-s       = 'workspace --auto-back-and-forth S'
    alt-shift-s = 'move-node-to-workspace S'

    # See: https://nikitabobko.github.io/AeroSpace/commands#workspace-back-and-forth
    alt-tab = 'workspace-back-and-forth'
    # See: https://nikitabobko.github.io/AeroSpace/commands#move-workspace-to-monitor
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    # See: https://nikitabobko.github.io/AeroSpace/commands#mode
    # Closest AeroSpace equivalent of a Hyprland submap
    alt-shift-r = 'mode service'

# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# Entered with alt-shift-r; acts like a Hyprland resize/utility submap.
[mode.service.binding]
    esc = ['reload-config', 'mode main']        # like `hyprctl reload`
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    backspace = ['close-all-windows-but-current', 'mode main']

    # sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
    #s = ['layout sticky tiling', 'mode main']

    down = 'volume down'
    up = 'volume up'
    shift-down = ['volume set 0', 'mode main']
